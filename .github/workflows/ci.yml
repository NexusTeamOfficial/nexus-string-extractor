name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Build & test
        run: |
          chmod +x gradlew || true
          if [ -f gradlew ]; then ./gradlew test shadowJar --no-daemon
          else gradle test shadowJar --no-daemon
          fi
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: nexus-string-extractor-0.1.0
          path: build/libs/nexus-string-extractor-0.1.0.jar
